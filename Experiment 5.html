<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experiment 5</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f2f2f2;
}

.container{
width:500px;
margin:auto;
margin-top:30px;
padding:20px;
background:white;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input{
width:90%;
padding:8px;
margin:5px;
}

button{
padding:10px;
margin:5px;
border:none;
background:blue;
color:white;
border-radius:5px;
cursor:pointer;
}

#output{
margin-top:20px;
text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h2>Employee Management System</h2>

<input type="text" id="name" placeholder="Employee Name">

<input type="number" id="salary" placeholder="Salary">

<input type="text" id="department" placeholder="Department">

<br>

<button onclick="addEmployee()">
Add Employee
</button>

<button onclick="displayEmployees()">
Display Employees
</button>

<button onclick="filterSalary()">
Salary > 50000
</button>

<button onclick="statistics()">
Statistics
</button>

<div id="output"></div>

</div>

<script>

let employees=[];

function addEmployee(){

let name=
document.getElementById("name").value;

let salary=
parseInt(document.getElementById("salary").value);

let department=
document.getElementById("department").value;

let emp={

name:name,
salary:salary,
department:department

};

employees.push(emp);

alert("Employee Added");

document.getElementById("name").value="";
document.getElementById("salary").value="";
document.getElementById("department").value="";

}


function displayEmployees(){

let result="<h3>Employee List</h3>";

employees.forEach(function(emp){

result+=

"Name: "+emp.name+
"<br>Salary: "+emp.salary+
"<br>Department: "+emp.department+
"<hr>";

});

document.getElementById("output").innerHTML=result;

}


function filterSalary(){

let filtered=
employees.filter(emp=>emp.salary>50000);

let result="<h3>Salary Above 50000</h3>";

filtered.forEach(emp=>{

result+=
emp.name+" - ₹"+emp.salary+"<br>";

});

document.getElementById("output").innerHTML=result;

}


function statistics(){

let total=
employees.reduce((sum,emp)=>sum+emp.salary,0);

let average=
total/employees.length;

let countIT=
employees.filter(emp=>
emp.department=="IT"
).length;

document.getElementById("output").innerHTML=

"<h3>Statistics</h3>"+
"Total Salary: ₹"+total+
"<br>Average Salary: ₹"+
average.toFixed(2)+
"<br>IT Employees: "+
countIT;

}

</script>

</body>
</html>
