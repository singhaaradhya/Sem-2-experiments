<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experiment 6</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:50px;
background-color:#f2f2f2;
}

.container{
width:500px;
margin:auto;
padding:20px;
background-color:white;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

button{
padding:10px;
margin:5px;
border:none;
background-color:blue;
color:white;
border-radius:5px;
cursor:pointer;
}

input{
padding:10px;
width:80%;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h1 id="heading">
Welcome to JavaScript
</h1>

<p id="para">
This is a paragraph for DOM manipulation.
</p>

<input type="text"
id="userInput"
placeholder="Enter heading text">

<br>

<button onclick="changeText()">
Change Heading
</button>

<button onclick="changeColor()">
Change Background
</button>

<button onclick="changeSize()">
Change Font Size
</button>

<button onclick="togglePara()">
Show / Hide Paragraph
</button>

<button onclick="resetPage()">
Reset
</button>

</div>


<script>

function changeText(){

let text=
document.getElementById("userInput").value;

document.getElementById("heading").innerHTML=text;

}

function changeColor(){

document.body.style.backgroundColor=
"lightblue";

}

function changeSize(){

document.getElementById("heading")
.style.fontSize="40px";

}

function togglePara(){

let p=
document.getElementById("para");

if(p.style.display==="none"){

p.style.display="block";

}
else{

p.style.display="none";

}

}

function resetPage(){

document.getElementById("heading")
.innerHTML="Welcome to JavaScript";

document.body.style.backgroundColor=
"#f2f2f2";

document.getElementById("heading")
.style.fontSize="32px";

document.getElementById("para")
.style.display="block";

document.getElementById("userInput")
.value="";

}

</script>

</body>
</html>
